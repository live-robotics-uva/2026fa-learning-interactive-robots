<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>
  <!-- expert region -->
  <rect x="500" y="40" width="190" height="220" fill="#e8f5e9"/>
  <text x="595" y="62" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">Expert in control</text>
  <!-- axes -->
  <line x1="60" y1="260" x2="690" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="40" x2="60" y2="260" stroke="#333" stroke-width="1.5"/>
  <text x="375" y="300" font-size="14" fill="#333" text-anchor="middle">robot timestep</text>
  <text x="18" y="150" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 18 150)">diffusion loss</text>
  <!-- threshold -->
  <line x1="60" y1="130" x2="690" y2="130" stroke="#d32f2f" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="68" y="122" font-size="13" fill="#d32f2f">α-quantile threshold</text>
  <!-- loss curve -->
  <polyline points="80,190 140,184 200,192 260,105 320,182 380,188 440,100 500,78" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <g fill="#1565c0">
    <circle cx="80" cy="190" r="5"/><circle cx="140" cy="184" r="5"/><circle cx="200" cy="192" r="5"/>
    <circle cx="320" cy="182" r="5"/><circle cx="380" cy="188" r="5"/>
  </g>
  <g fill="#d32f2f">
    <circle cx="260" cy="105" r="6"/><circle cx="440" cy="100" r="6"/><circle cx="500" cy="78" r="6"/>
  </g>
  <!-- annotations -->
  <text x="260" y="88" font-size="13" fill="#333" text-anchor="middle">1 spike</text>
  <text x="260" y="226" font-size="13" fill="#333" text-anchor="middle">ignored:</text>
  <text x="260" y="242" font-size="13" fill="#333" text-anchor="middle">not K in a row</text>
  <text x="470" y="215" font-size="13" fill="#333" text-anchor="middle">2 in a row</text>
  <text x="470" y="231" font-size="13" fill="#333" text-anchor="middle">(K = 2)</text>
  <line x1="470" y1="203" x2="470" y2="112" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="500" y="285" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">takeover</text>
  <line x1="500" y1="262" x2="500" y2="272" stroke="#2e7d32" stroke-width="2"/>
  <!-- title -->
  <text x="360" y="24" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">Query rule: loss above threshold for K steps in a row</text>
</svg>
