<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="Latent actions plus shared autonomy: joystick to belief conditioned decoder and parallel goal guidance, then blended action">
<defs><style>
  .bg{fill:#fff}.heading{font:700 24px system-ui,-apple-system,sans-serif;fill:#17283a}.sub{font:500 14px system-ui,sans-serif;fill:#607287}.lab{font:600 16px system-ui,sans-serif;fill:#1b344f}.small{font:500 13px system-ui,sans-serif;fill:#476179}.n{font:700 12px system-ui,sans-serif;fill:#61738c}.box{fill:#f8fafc;stroke:#dce4ef;stroke-width:1.5}.teal{fill:#e5f5f2;stroke:#52ab9b;stroke-width:1.5}.orange{fill:#fff1e3;stroke:#e4a061;stroke-width:1.5}.purple{fill:#f1edfb;stroke:#8f7bc6;stroke-width:1.5}.line{fill:none;stroke:#7e90a4;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.darkline{fill:none;stroke:#4c637e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7e90a4"/></marker><marker id="arrdark" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4c637e"/></marker></defs><rect width="1040" height="420" rx="22" fill="#ffffff"/>
<text class="heading" x="35" y="48">LA+SA: interpret the input in context</text><text class="sub" x="35" y="78">One low-dimensional joystick can control reaching, then fine manipulation as goal belief changes.</text>
<rect class="teal" x="33" y="147" rx="15" width="180" height="91"/><text class="lab" x="123" y="177" text-anchor="middle">Joystick z</text><text class="small" x="123" y="202" text-anchor="middle">Low-DoF input</text>
<path class="line" d="M213 193 H268" marker-end="url(#arr)"/>
<rect class="purple" x="268" y="119" rx="16" width="253" height="139"/><text class="lab" x="394" y="151" text-anchor="middle">Latent action decoder</text><text class="small" x="394" y="178" text-anchor="middle">a_h = φ(z, s, b)</text><text class="small" x="394" y="205" text-anchor="middle">Unsure: goal-directed motion</text><text class="small" x="394" y="229" text-anchor="middle">Confident: fine preference</text>
<rect class="box" x="268" y="302" rx="15" width="253" height="77"/><text class="lab" x="394" y="334" text-anchor="middle">Goal belief b(g)</text><text class="small" x="394" y="355" text-anchor="middle">Updated from human action</text><path class="line" d="M394 302 V263" marker-end="url(#arr)"/>
<path class="line" d="M521 168 H845 V218 H857" marker-end="url(#arr)"/>
<path class="line" d="M521 340 H565 V280 H637" marker-end="url(#arr)"/>
<rect class="orange" x="637" y="203" rx="14" width="185" height="106"/><text class="lab" x="730" y="231" text-anchor="middle">Autonomous</text><text class="lab" x="730" y="252" text-anchor="middle">guidance</text><text class="small" x="730" y="279" text-anchor="middle">a_r = ∑ b(g)(g−s)</text>
<path class="darkline" d="M822 279 H857" marker-end="url(#arrdark)"/>
<rect class="box" x="857" y="202" rx="13" width="155" height="105"/><text class="lab" x="934" y="231" text-anchor="middle">Blend</text><text class="small" x="934" y="253" text-anchor="middle">a = (1−α)a_h</text><text class="small" x="934" y="272" text-anchor="middle">+ αa_r</text>
<text class="n" x="523" y="406" text-anchor="middle">Entropy-regularized training preserves alternative reachable goals when the belief is wrong.</text></svg>