<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="365" viewBox="0 0 1040 365" role="img" aria-label="Shared autonomy pipeline: human input and machine assistance combine into an executed robot action">
<defs><style>
  .bg{fill:#fff}.heading{font:700 24px system-ui,-apple-system,sans-serif;fill:#17283a}.sub{font:500 14px system-ui,sans-serif;fill:#607287}.lab{font:600 16px system-ui,sans-serif;fill:#1b344f}.small{font:500 13px system-ui,sans-serif;fill:#476179}.n{font:700 12px system-ui,sans-serif;fill:#61738c}.box{fill:#f8fafc;stroke:#dce4ef;stroke-width:1.5}.teal{fill:#e5f5f2;stroke:#52ab9b;stroke-width:1.5}.orange{fill:#fff1e3;stroke:#e4a061;stroke-width:1.5}.purple{fill:#f1edfb;stroke:#8f7bc6;stroke-width:1.5}.line{fill:none;stroke:#7e90a4;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.darkline{fill:none;stroke:#4c637e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7e90a4"/></marker><marker id="arrdark" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4c637e"/></marker></defs><rect width="1040" height="365" rx="22" fill="#ffffff"/>
<text class="heading" x="35" y="47">Shared autonomy: assistance without losing intent</text><text class="sub" x="35" y="74">Two complementary signals must agree before the machine acts.</text>
<rect class="teal" rx="17" x="38" y="115" width="220" height="92"/><text class="lab" x="148" y="147" text-anchor="middle">Human</text><text class="small" x="148" y="174" text-anchor="middle">Goal + control signal</text>
<rect class="purple" rx="17" x="38" y="241" width="220" height="92"/><text class="lab" x="148" y="273" text-anchor="middle">Robot intelligence</text><text class="small" x="148" y="299" text-anchor="middle">Belief + learned policy</text>
<path class="line" d="M258 162 H347 V200 H414" marker-end="url(#arr)"/><path class="line" d="M258 287 H347 V239 H414" marker-end="url(#arr)"/>
<rect class="box" rx="20" x="414" y="170" width="205" height="98"/><text class="lab" x="516" y="205" text-anchor="middle">Shared control</text><text class="small" x="516" y="229" text-anchor="middle">Arbitrate or blend</text><text class="small" x="516" y="247" text-anchor="middle">actions</text>
<path class="darkline" d="M619 219 H698" marker-end="url(#arrdark)"/><rect class="orange" x="698" y="170" rx="20" width="204" height="98"/><text class="lab" x="800" y="205" text-anchor="middle">Executed action</text><text class="small" x="800" y="229" text-anchor="middle">Better task outcome,</text><text class="small" x="800" y="247" text-anchor="middle">aligned with the user</text>
<path class="line" d="M800 268 V324 H516 V269" stroke-dasharray="6 6" marker-end="url(#arr)"/><text class="n" x="668" y="348" text-anchor="middle">Feedback from interaction</text></svg>