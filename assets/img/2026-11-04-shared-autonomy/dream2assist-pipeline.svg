<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-label="Dream2Assist method: labeled drivers, intent aware world model, assistive policy, combined control">
<defs><style>
  .bg{fill:#fff}.heading{font:700 24px system-ui,-apple-system,sans-serif;fill:#17283a}.sub{font:500 14px system-ui,sans-serif;fill:#607287}.lab{font:600 16px system-ui,sans-serif;fill:#1b344f}.small{font:500 13px system-ui,sans-serif;fill:#476179}.n{font:700 12px system-ui,sans-serif;fill:#61738c}.box{fill:#f8fafc;stroke:#dce4ef;stroke-width:1.5}.teal{fill:#e5f5f2;stroke:#52ab9b;stroke-width:1.5}.orange{fill:#fff1e3;stroke:#e4a061;stroke-width:1.5}.purple{fill:#f1edfb;stroke:#8f7bc6;stroke-width:1.5}.line{fill:none;stroke:#7e90a4;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.darkline{fill:none;stroke:#4c637e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7e90a4"/></marker><marker id="arrdark" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4c637e"/></marker></defs><rect width="1040" height="410" rx="22" fill="#ffffff"/>
<text class="heading" x="35" y="47">Dream2Assist: infer first, intervene second</text><text class="sub" x="35" y="75">A learned world model connects observed driving behavior with tactical objectives.</text>
<rect class="teal" x="30" y="117" rx="17" width="222" height="224"/><text class="lab" x="141" y="149" text-anchor="middle">Synthetic drivers</text>
<rect fill="#fff" stroke="#b3ddd6" stroke-width="1" rx="10" x="50" y="175" width="88" height="54"/><text class="small" x="94" y="197" text-anchor="middle">PASS</text><text class="n" x="94" y="216" text-anchor="middle">skill 1..K</text>
<rect fill="#fff" stroke="#b3ddd6" stroke-width="1" rx="10" x="146" y="175" width="88" height="54"/><text class="small" x="190" y="197" text-anchor="middle">STAY</text><text class="n" x="190" y="216" text-anchor="middle">skill 1..K</text>
<rect fill="#fff" stroke="#b3ddd6" stroke-width="1" rx="10" x="50" y="239" width="88" height="54"/><text class="small" x="94" y="261" text-anchor="middle">LEFT</text><text class="n" x="94" y="280" text-anchor="middle">skill 1..K</text>
<rect fill="#fff" stroke="#b3ddd6" stroke-width="1" rx="10" x="146" y="239" width="88" height="54"/><text class="small" x="190" y="261" text-anchor="middle">RIGHT</text><text class="n" x="190" y="280" text-anchor="middle">skill 1..K</text>
<path class="line" d="M252 226 H304" marker-end="url(#arr)"/>
<rect class="purple" x="304" y="122" rx="17" width="260" height="224"/><text class="lab" x="434" y="155" text-anchor="middle">RSSM world model</text><text class="small" x="434" y="181" text-anchor="middle">Recurrent memory + latent state</text><rect x="330" y="204" rx="8" width="208" height="42" fill="#fff" stroke="#d2c7ee"/><text class="small" x="434" y="230" text-anchor="middle">Scene + reward predictions</text><rect x="330" y="258" rx="8" width="208" height="42" fill="#fff" stroke="#d2c7ee"/><text class="small" x="434" y="284" text-anchor="middle">Predicted intent  ŷ</text>
<path class="line" d="M564 226 H616" marker-end="url(#arr)"/>
<rect class="orange" x="616" y="148" rx="17" width="192" height="168"/><text class="lab" x="712" y="179" text-anchor="middle">Assistant policy</text><text class="small" x="712" y="207" text-anchor="middle">Task reward</text><text class="small" x="712" y="230" text-anchor="middle">Expert-alignment reward</text><text class="small" x="712" y="253" text-anchor="middle">Intervention penalty</text><text class="n" x="712" y="283" text-anchor="middle">assistant action</text>
<path class="darkline" d="M808 226 H842" marker-end="url(#arrdark)"/><rect class="box" x="842" y="179" rx="13" width="166" height="99"/><text class="lab" x="925" y="210" text-anchor="middle">Action to car</text><text class="small" x="925" y="237" text-anchor="middle">clip(human + assist)</text><text class="n" x="925" y="257" text-anchor="middle">in [−1,1]</text>
<text class="n" x="521" y="378" text-anchor="middle">Assistant learns across many objectives and human skill levels, not just one ideal driver.</text></svg>