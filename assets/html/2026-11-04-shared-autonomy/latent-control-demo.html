<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:#1f3349;background:#fbfcfe;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{padding:18px 24px 14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:12px}.control{min-width:0}.cap{display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:13px;margin-bottom:10px}.val{font-variant-numeric:tabular-nums;color:#426e8c}input{width:100%;accent-color:#237e8d}.note{font-size:12px;color:#62788c;margin-top:7px}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;margin-top:10px}.line{width:18px;height:3px;margin-top:8px;display:inline-block;vertical-align:middle}.legend span{display:flex;gap:8px;align-items:center}.svg{width:100%;height:250px;display:block;border:1px solid #e0e7f0;border-radius:12px;background:white}
@media(max-width:640px){main{padding:12px}.controls{grid-template-columns:1fr;gap:10px}.svg{height:240px}}
</style></head><body><main>
<div class="controls"><div class="control"><div class="cap"><label for="belief">Belief in goal 1</label><output class="val" id="beliefVal">75%</output></div><input id="belief" type="range" min="0" max="100" step="1" value="75"><div class="note">Changes the goal-weighted robot suggestion.</div></div>
<div class="control"><div class="cap"><label for="alpha">Assistance weight α</label><output class="val" id="alphaVal">40%</output></div><input id="alpha" type="range" min="0" max="100" step="1" value="40"><div class="note">Changes how strongly the suggestion affects the final action.</div></div></div>
<svg id="v" class="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 266" role="img" aria-label="Planar arrows for human action, belief weighted robot suggestion and blended executed action">
<defs><marker id="mh" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#338c83"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#c5863c"/></marker><marker id="mf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#7055b9"/></marker></defs>
<path d="M30 133H790 M260 20V246" stroke="#e3e9f0" stroke-width="1" stroke-dasharray="4 4"/>
<g opacity="0.92"><circle cx="660" cy="52" r="18" fill="#dcf3ee" stroke="#3f9a8b" stroke-width="2"/><text x="687" y="55" fill="#356b66" font-size="17" font-weight="650">Goal 1</text><circle cx="660" cy="217" r="18" fill="#f7e8d8" stroke="#c5863c" stroke-width="2"/><text x="687" y="221" fill="#85572e" font-size="17" font-weight="650">Goal 2</text></g>
<circle cx="260" cy="133" r="9" fill="#25394d"/><text x="230" y="158" text-anchor="middle" font-size="14" fill="#526c83">Robot</text>
<line id="human" x1="260" y1="133" x2="390" y2="97" stroke="#338c83" stroke-width="4" stroke-linecap="round" marker-end="url(#mh)"/>
<line id="suggest" x1="260" y1="133" x2="420" y2="86" stroke="#c5863c" stroke-width="4" stroke-linecap="round" marker-end="url(#mr)"/>
<line id="final" x1="260" y1="133" x2="420" y2="86" stroke="#7055b9" stroke-width="5" stroke-linecap="round" marker-end="url(#mf)"/>
<text id="hint" x="30" y="28" font-size="13" fill="#536980">Human input held fixed to isolate belief and blending effects.</text>
</svg>
<div class="legend"><span><b class="line" style="background:#338c83"></b> Human action</span><span><b class="line" style="background:#c5863c"></b> Goal-weighted suggestion</span><span><b class="line" style="background:#7055b9"></b> Executed blend</span></div>
<div class="note">Conceptual 2D visualization of the blending equations, not a learned LA+SA controller or experimental result.</div>
</main><script>
(() => {const B=document.getElementById('belief'),A=document.getElementById('alpha');const p0=[260,133],g1=[660,52],g2=[660,217],h=[130,-36];function setLine(id,x,y){let L=document.getElementById(id);L.setAttribute('x2',(p0[0]+x).toFixed(2));L.setAttribute('y2',(p0[1]+y).toFixed(2))}function upd(){let p=+B.value/100,a=+A.value/100;document.getElementById('beliefVal').textContent=Math.round(p*100)+'%';document.getElementById('alphaVal').textContent=Math.round(a*100)+'%';let r=[(p*(g1[0]-p0[0])+(1-p)*(g2[0]-p0[0]))*.34,(p*(g1[1]-p0[1])+(1-p)*(g2[1]-p0[1]))*.34],final=[(1-a)*h[0]+a*r[0],(1-a)*h[1]+a*r[1]];setLine('human',h[0],h[1]);setLine('suggest',r[0],r[1]);setLine('final',final[0],final[1]);}B.addEventListener('input',upd);A.addEventListener('input',upd);upd();})();
</script></body></html>
